<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>تخته‌کلیپ | Board Clip</title>
<meta name="description" content="اپلیکیشن ساخت کلیپ‌های آموزشی: تخته سفید، آپلود کتاب و عکس، ضبط صدا و تصویر با کیفیت بالا">
<meta name="theme-color" content="#5B5FEF">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="تخته‌کلیپ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app" class="app">

  <!-- ===== Top bar ===== -->
  <header class="topbar" id="topbar">
    <button class="icon-btn" id="btnMenu" title="پروژه‌ها و صفحات" aria-label="پروژه‌ها و صفحات">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>

    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">تخته‌کلیپ</span>
    </div>

    <div class="topbar-actions">
      <button class="icon-btn" id="btnTheme" title="حالت روز/شب" aria-label="تغییر حالت روز و شب">
        <svg viewBox="0 0 24 24" id="themeIcon"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.4 5.4 0 0 1-7.54-7.54A9 9 0 0 0 12 3z"/></svg>
      </button>
      <button class="icon-btn" id="btnPanZoom" title="حالت اسکرول (قلم غیرفعال)" aria-label="حالت اسکرول">
        <svg viewBox="0 0 24 24"><path d="M13 3v7h7M13 3l7 7M11 21v-7H4m7 7l-7-7M13 21v-7h7m-7 7l7-7M11 3v7H4m7-7L4 10"/></svg>
      </button>
      <button class="icon-btn accent" id="btnUpload" title="آپلود کتاب یا عکس" aria-label="آپلود فایل">
        <svg viewBox="0 0 24 24"><path d="M12 16V4m0 0L7 9m5-5l5 5M5 20h14"/></svg>
      </button>
      <button class="icon-btn install-btn" id="btnInstall" title="نصب اپ روی دستگاه" aria-label="نصب اپلیکیشن" hidden>
        <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>
      </button>
    </div>
  </header>

  <!-- ===== Stage ===== -->
  <main class="stage" id="stage">

    <!-- File layer: pdf/image pages, scrollable -->
    <div class="file-layer" id="fileLayer">
      <div class="file-scroll" id="fileScroll">
        <div class="file-pages" id="filePages"></div>
      </div>
    </div>

    <!-- Drawing layer: one canvas per board/page -->
    <div class="draw-layer" id="drawLayer">
      <canvas id="drawCanvas"></canvas>
    </div>

    <!-- offscreen composite canvas used only while recording -->
    <canvas id="composeCanvas" class="hidden-canvas"></canvas>

    <!-- Empty state -->
    <div class="empty-hint" id="emptyHint">
      <p>تخته سفید آماده‌ست ✏️</p>
      <span>برای شروع نقاشی کنید، یا از دکمهٔ آپلود یک کتاب/عکس اضافه کنید</span>
    </div>

    <!-- Page jump control (visible on file pages) -->
    <div class="page-jump" id="pageJump" hidden>
      <button id="pageJumpPrev" class="mini-btn" aria-label="صفحه قبل">‹</button>
      <input type="number" id="pageJumpInput" min="1" value="1">
      <span id="pageJumpTotal">/ 1</span>
      <button id="pageJumpNext" class="mini-btn" aria-label="صفحه بعد">›</button>
    </div>

  </main>

  <!-- ===== Floating tool dock ===== -->
  <div class="dock-wrap" id="dockWrap">
    <button class="dock-handle" id="dockHandle" aria-label="نمایش/مخفی کردن ابزارها" title="نمایش یا مخفی‌کردن ابزارها">
      <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
    </button>

    <div class="dock" id="dock">
      <div class="tool-group" id="toolGroup">
        <button class="tool-btn active" data-tool="pen" title="قلم آزاد">
          <svg viewBox="0 0 24 24"><path d="M3 21l3.6-.7c.5-.1 1-.4 1.4-.8L19.2 8.3a2 2 0 0 0 0-2.8l-1.7-1.7a2 2 0 0 0-2.8 0L3.5 15c-.4.4-.7.9-.8 1.4L2 21z"/></svg>
        </button>
        <button class="tool-btn" data-tool="line" title="خط راست">
          <svg viewBox="0 0 24 24"><path d="M4 20L20 4"/></svg>
        </button>
        <button class="tool-btn" data-tool="rect" title="مربع/مستطیل">
          <svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg>
        </button>
        <button class="tool-btn" data-tool="circle" title="دایره">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>
        </button>
        <button class="tool-btn" data-tool="triangle" title="مثلث">
          <svg viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/></svg>
        </button>
        <button class="tool-btn" data-tool="eraser" title="پاک‌کن">
          <svg viewBox="0 0 24 24"><path d="M16 3l5 5-9.5 9.5H6L2 13.5c-.5-.5-.5-1.3 0-1.8L12.2 1.5c.5-.5 1.3-.5 1.8 0L16 3zM7 21h13"/></svg>
        </button>
      </div>

      <div class="dock-sep"></div>

      <div class="control-row">
        <label class="ctrl-label">رنگ</label>
        <div class="swatches" id="swatches"></div>
        <input type="color" id="colorPicker" value="#5B5FEF" aria-label="انتخاب رنگ سفارشی">
      </div>

      <div class="control-row">
        <label class="ctrl-label">ضخامت</label>
        <input type="range" id="thicknessRange" min="1" max="40" value="4">
        <span class="ctrl-value" id="thicknessValue">4</span>
      </div>

      <div class="dock-sep"></div>

      <div class="tool-group">
        <button class="tool-btn" id="btnUndo" title="واگرد">
          <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        </button>
        <button class="tool-btn" id="btnRedo" title="ازنو">
          <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
        </button>
        <button class="tool-btn" id="btnClear" title="پاک کردن کل صفحه">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- ===== Bottom navigator (filmstrip of boards/pages) ===== -->
  <div class="navbar-wrap" id="navbarWrap">
    <button class="navbar-handle" id="navbarHandle" aria-label="نمایش صفحات" title="نمایش/مخفی‌کردن صفحات">
      <svg viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg>
    </button>
    <div class="navbar" id="navbar">
      <div class="film" id="film"></div>
      <button class="add-board-btn" id="btnAddBoard" title="تخته سفید جدید">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        <span>تخته جدید</span>
      </button>
    </div>
  </div>

  <!-- ===== Record control ===== -->
  <div class="record-wrap" id="recordWrap">
    <div class="rec-timer" id="recTimer" hidden>00:00</div>
    <button class="rec-orb" id="btnRecord" aria-label="شروع ضبط">
      <span class="rec-ring" id="recRing"></span>
      <span class="rec-core" id="recCore"></span>
    </button>
    <div class="mic-meter" id="micMeter" hidden><div class="mic-fill" id="micFill"></div></div>
  </div>

  <!-- ===== Side panel: projects / pages list / settings ===== -->
  <aside class="side-panel" id="sidePanel">
    <div class="side-header">
      <h2>پروژه‌ها و صفحات</h2>
      <button class="icon-btn" id="btnCloseSide" aria-label="بستن">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="side-section">
      <h3>صفحات باز</h3>
      <div id="sidePages" class="side-list"></div>
    </div>
    <div class="side-section">
      <h3>تنظیمات ضبط</h3>
      <label class="side-row">
        <span>حذف نویز میکروفون</span>
        <input type="checkbox" id="optNoiseSuppression" checked>
      </label>
      <label class="side-row">
        <span>یکنواخت‌سازی صدا (AGC)</span>
        <input type="checkbox" id="optAutoGain" checked>
      </label>
      <label class="side-row">
        <span>حذف اکو</span>
        <input type="checkbox" id="optEchoCancel" checked>
      </label>
      <label class="side-row">
        <span>کیفیت ویدیو</span>
        <select id="optVideoQuality">
          <option value="1">استاندارد</option>
          <option value="1.5" selected>بالا</option>
          <option value="2">فوق‌العاده (فایل بزرگ‌تر)</option>
        </select>
      </label>
    </div>
    <div class="side-section">
      <h3>پروژه</h3>
      <button class="side-btn" id="btnSaveProject">ذخیره پروژه</button>
      <button class="side-btn" id="btnExportPNG">خروجی PNG از صفحه فعلی</button>
      <button class="side-btn danger" id="btnResetProject">شروع پروژه جدید (پاک‌کردن همه)</button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <input type="file" id="fileInput" accept="application/pdf,image/*" multiple hidden>
  <a id="downloadLink" hidden></a>
</div>

<div id="toast" class="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  if (window['pdfjsLib']) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  }
</script>
<script src="storage.js"></script>
<script src="board.js"></script>
<script src="pdfview.js"></script>
<script src="recorder.js"></script>
<script src="app.js"></script>
</body>
</html>
