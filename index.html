<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>تخته هوشمند تدریس</title>
<meta name="theme-color" content="#1c2333">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --bg:#f3f2ee;
    --panel:#ffffff;
    --panel-2:#f7f6f2;
    --ink:#1c1b18;
    --ink-soft:#5c5a54;
    --line:#e2e0d8;
    --accent:#2f6f5e;
    --accent-soft:#e4efe9;
    --danger:#b3452f;
    --shadow: 0 6px 24px rgba(20,20,15,0.10);
    --radius:14px;
    --tool-size:46px;
  }
  [data-theme="dark"]{
    --bg:#14171d;
    --panel:#1c212b;
    --panel-2:#232935;
    --ink:#eceae3;
    --ink-soft:#a4a9b3;
    --line:#2c3340;
    --accent:#4fa98b;
    --accent-soft:#1e3a34;
    --danger:#e0725a;
    --shadow: 0 6px 24px rgba(0,0,0,0.4);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;overflow:hidden;
    font-family:'Vazirmatn','Segoe UI',Tahoma,sans-serif;
    background:var(--bg); color:var(--ink);
    -webkit-user-select:none; user-select:none;
    touch-action:none;
  }
  #app{ display:flex; flex-direction:column; height:100%; height:100dvh; }

  /* ===== Top bar ===== */
  #topbar{
    display:flex; align-items:center; gap:8px;
    padding:8px 10px; background:var(--panel);
    border-bottom:1px solid var(--line); flex-wrap:wrap;
    z-index:20;
  }
  #topbar .grp{ display:flex; align-items:center; gap:6px; }
  #topbar .sep{ width:1px; height:26px; background:var(--line); margin:0 4px; }
  .brand{ font-weight:700; font-size:15px; margin-left:6px; white-space:nowrap; }
  .brand span{ color:var(--accent); }

  button, .btn{
    border:1px solid var(--line); background:var(--panel-2); color:var(--ink);
    border-radius:10px; padding:8px 10px; font-size:13px; cursor:pointer;
    display:flex; align-items:center; gap:6px; font-family:inherit;
    transition:background .15s, transform .05s;
  }
  button:hover{ background:var(--accent-soft); }
  button:active{ transform:scale(.96); }
  button.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
  button.icon-only{ width:38px; height:38px; padding:0; justify-content:center; }
  button:disabled{ opacity:.4; cursor:not-allowed; }
  button.danger{ color:var(--danger); }
  button.record-btn{ background:var(--danger); color:#fff; border-color:var(--danger); font-weight:600; }
  button.record-btn.recording{ animation:pulse 1.4s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.55;} }

  select, input[type=color], input[type=range]{ font-family:inherit; }

  /* ===== Tabs (boards) ===== */
  #tabsbar{
    display:flex; align-items:center; gap:4px; padding:4px 10px;
    background:var(--panel-2); border-bottom:1px solid var(--line);
    overflow-x:auto; white-space:nowrap; z-index:15;
  }
  .tab{
    padding:6px 12px; border-radius:8px 8px 0 0; font-size:12px; cursor:pointer;
    background:transparent; color:var(--ink-soft); border:1px solid transparent; border-bottom:none;
    display:flex; align-items:center; gap:6px; flex-shrink:0;
  }
  .tab.active{ background:var(--panel); color:var(--ink); border-color:var(--line); font-weight:600; }
  .tab .close-tab{ opacity:.5; font-size:11px; padding:2px 4px; border-radius:4px; }
  .tab .close-tab:hover{ opacity:1; background:var(--danger); color:#fff; }
  .tab-add{ padding:6px 10px; border-radius:8px; color:var(--accent); font-weight:700; }

  /* ===== Canvas area ===== */
  #stage-wrap{ position:relative; flex:1; overflow:auto; background:repeating-conic-gradient(var(--panel-2) 0% 25%, var(--bg) 0% 50%) 0 0/22px 22px; }
  [data-theme="dark"] #stage-wrap{ background:var(--bg); }
  #stage{ position:relative; margin:0 auto; transform-origin:top center; }
  canvas.layer{ position:absolute; top:0; left:0; display:block; background:transparent; }
  #bgCanvas{ background:#fff; box-shadow:var(--shadow); }
  [data-theme="dark"] #bgCanvas{ background:#20242c; }
  #drawCanvas{ touch-action:none; cursor:crosshair; }

  #webcamPip{
    position:absolute; width:140px; height:140px; border-radius:50%;
    overflow:hidden; border:3px solid var(--accent); box-shadow:var(--shadow);
    cursor:grab; z-index:30; display:none; background:#000;
  }
  #webcamPip.rect{ border-radius:12px; width:200px; height:140px; }
  #webcamPip video{ width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
  #webcamPip.dragging{ cursor:grabbing; }

  /* ===== Left tool rail ===== */
  #toolrail{
    position:absolute; top:12px; right:12px; display:flex; flex-direction:column; gap:6px;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:6px; box-shadow:var(--shadow); z-index:25;
  }
  #toolrail button{ width:var(--tool-size); height:var(--tool-size); padding:0; justify-content:center; font-size:18px; }

  #propPanel{
    position:absolute; top:12px; right:calc(var(--tool-size) + 30px);
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:10px; box-shadow:var(--shadow); z-index:25; display:flex; flex-direction:column; gap:10px;
    width:190px; font-size:12px;
  }
  #propPanel label{ display:flex; flex-direction:column; gap:4px; color:var(--ink-soft); }
  #colorSwatches{ display:flex; flex-wrap:wrap; gap:5px; }
  .swatch{ width:20px; height:20px; border-radius:50%; border:2px solid #0000; cursor:pointer; }
  .swatch.selected{ border-color:var(--ink); }
  input[type=range]{ width:100%; }

  /* ===== Zoom control ===== */
  #zoomCtrl{
    position:absolute; bottom:14px; left:14px; display:flex; align-items:center; gap:6px;
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:6px 8px;
    box-shadow:var(--shadow); z-index:25; font-size:12px;
  }

  /* ===== Bottom-right student count / status ===== */
  #status{
    position:absolute; bottom:14px; right:14px; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:6px 12px; font-size:12px; color:var(--ink-soft); box-shadow:var(--shadow); z-index:25;
  }

  /* ===== Modal ===== */
  .modal-back{ position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; z-index:100; }
  .modal-back.show{ display:flex; }
  .modal{ background:var(--panel); border-radius:16px; padding:22px; width:min(420px,92vw); box-shadow:var(--shadow); }
  .modal h3{ margin:0 0 12px; }
  .modal p{ color:var(--ink-soft); font-size:13px; line-height:1.9; }
  .modal .row{ display:flex; gap:8px; margin-top:16px; justify-content:flex-end; }

  #hiddenFileInput{ display:none; }
  #toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:10px;
    font-size:13px; z-index:200; opacity:0; pointer-events:none; transition:opacity .25s;
  }
  #toast.show{ opacity:1; }

  ::-webkit-scrollbar{ height:8px; width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
</style>
</head>
<body data-theme="light">
<div id="app">

  <!-- TOP BAR -->
  <div id="topbar">
    <div class="brand">تخته<span>هوشمند</span></div>
    <div class="sep"></div>
    <div class="grp">
      <button id="btnUpload" title="آپلود عکس یا PDF">📎 آپلود فایل</button>
      <input id="hiddenFileInput" type="file" accept="image/png,image/jpeg,application/pdf" multiple>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <button id="btnUndo" class="icon-only" title="واگرد (Ctrl+Z)">↩️</button>
      <button id="btnRedo" class="icon-only" title="ازنو (Ctrl+Y)">↪️</button>
      <button id="btnClear" class="icon-only danger" title="پاک کردن کل تخته">🗑️</button>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <button id="btnExportPng" title="خروجی PNG">🖼️ PNG</button>
      <button id="btnExportPdf" title="خروجی PDF">📄 PDF</button>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <button id="btnFullscreen" class="icon-only" title="تمام‌صفحه">⛶</button>
      <button id="btnTheme" class="icon-only" title="حالت روز/شب">🌙</button>
    </div>
    <div style="flex:1"></div>
    <div class="grp">
      <span id="saveIndicator" style="font-size:11px;color:var(--ink-soft);"></span>
      <button id="btnRecord" class="record-btn">⏺️ شروع ضبط</button>
      <span id="recTimer" style="font-size:12px; font-variant-numeric:tabular-nums; display:none;">00:00</span>
    </div>
  </div>

  <!-- TABS -->
  <div id="tabsbar"></div>

  <!-- STAGE -->
  <div id="stage-wrap">
    <div id="stage">
      <canvas id="bgCanvas" class="layer"></canvas>
      <canvas id="drawCanvas" class="layer"></canvas>
      <div id="webcamPip"><video id="webcamVideo" autoplay muted playsinline></video></div>
    </div>

    <!-- TOOL RAIL -->
    <div id="toolrail">
      <button id="toolPen" class="tool-btn active" data-tool="pen" title="قلم">✏️</button>
      <button id="toolLine" class="tool-btn" data-tool="line" title="خط راست">📏</button>
      <button id="toolRect" class="tool-btn" data-tool="rect" title="مستطیل">▭</button>
      <button id="toolCircle" class="tool-btn" data-tool="circle" title="دایره">◯</button>
      <button id="toolTriangle" class="tool-btn" data-tool="triangle" title="مثلث">△</button>
      <button id="toolRuler" class="tool-btn" data-tool="ruler" title="خط‌کش/زاویه‌یاب">📐</button>
      <button id="toolEraser" class="tool-btn" data-tool="eraser" title="پاک‌کن نقطه‌ای">🧽</button>
      <button id="toolText" class="tool-btn" data-tool="text" title="متن">🅰️</button>
    </div>

    <!-- PROPERTIES -->
    <div id="propPanel">
      <label>رنگ
        <div id="colorSwatches"></div>
        <input type="color" id="colorPicker" value="#2f6f5e" style="margin-top:4px;width:100%;height:28px;border:none;border-radius:6px;">
      </label>
      <label>ضخامت: <span id="sizeLabel">4</span>px
        <input type="range" id="sizeRange" min="1" max="20" value="4">
      </label>
    </div>

    <!-- ZOOM -->
    <div id="zoomCtrl">
      <button id="zoomOut" class="icon-only" style="width:28px;height:28px;">－</button>
      <span id="zoomLabel">100%</span>
      <button id="zoomIn" class="icon-only" style="width:28px;height:28px;">＋</button>
      <button id="zoomReset" style="padding:4px 8px;">تنظیم</button>
    </div>

    <!-- STATUS -->
    <div id="status">🖊️ آماده</div>
  </div>
</div>

<!-- Camera setup modal -->
<div class="modal-back" id="recordModalBack">
  <div class="modal">
    <h3>تنظیمات ضبط</h3>
    <p>می‌خوای همراه صدا، تصویر دوربین هم گوشه صفحه نشون داده بشه؟ کیفیت خروجی بر اساس امکانات مرورگر فشرده‌سازی می‌شه (VP9/H.264 هرکدوم که مرورگرت پشتیبانی کنه).</p>
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;">
      <input type="checkbox" id="chkWebcam"> نمایش تصویر دوربین در گوشه صفحه
    </label>
    <div class="row">
      <button id="btnCancelRecord">انصراف</button>
      <button id="btnStartRecordConfirm" class="active">شروع ضبط</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="app.js"></script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW fail',e));
  });
}
</script>
</body>
</html>
