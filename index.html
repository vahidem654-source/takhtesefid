<style>

</style></head><body>
<canvas id="c"></canvas><div id="cr">تهیه‌کننده: وحیده محجوب</div><video id="vid" playsinline muted style="position:fixed;width:2px;height:2px;opacity:0;pointer-events:none"></video>

<div id="bar" class="pn"></div>
<div id="sh" class="pn h">
 <div class="r"><b id="lab">-</b><input type="range" id="sl" min="1" max="1" value="1" style="flex:1;min-width:120px;accent-color:var(--ac)"></div>
  <div class="r"><label class="b p">📕 کتاب / پاورپوینت<input type="file" accept="application/pdf,.pdf,.ppt,.pptx,.pps,.ppsx,.odp" hidden id="fp"></label><label class="b">🖼 عکس<input type="file" accept="image/*" hidden id="fi"></label><label class="b p">🎞 ویدیو<input type="file" accept="video/*" hidden id="fv"></label><button data-a="new">＋ تخته</button><button data-a="fit">اندازه‌ی صفحه</button></div>

 <div class="r" id="vo" style="display:none;flex-direction:column;align-items:flex-start"><label><input type="checkbox" id="va" checked> با شروع ضبط، ویدیو هم خودکار پخش شود</label><label><input type="checkbox" id="ve" checked> با تمام شدن ویدیو، ضبط هم تمام شود</label></div>
 <div class="r"><button data-a="music">🎵 آهنگ پس‌زمینه روی کلیپ…</button></div>

  <select id="md"><option value="two">خودکار/انگشت — اسکرول با دو انگشت</option><option value="auto">تشخیص با اندازه‌ی لمس — اسکرول با یک انگشت</option><option value="pen">فقط استایلوس فعال</option></select></label><button data-a="cal">کالیبره</button></div>
 <div class="r"><label><input type="checkbox" id="tc"> نمایش لمس‌ها و حرکت انگشت در کلیپ (بدون کشیدن خط؛ دکمه‌ی 👆 کنار صفحه هم همین است)</label></div>
 <div class="r"><label><input type="checkbox" id="cm"> دوربین (چهره)</label><label>نرمی صدا: <select id="sf"><option value="0">طبیعی</option><option value="3">ملایم</option><option value="6">نرم‌تر</option></select></label></div>
</div>
<div id="cd"></div><div id="ts"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const $=s=>document.querySelector(s),cv=$('#c'),cx=cv.getContext('2d'),W=1400,GAP=14,bar=$('#bar'),sh=$('#sh'),vid=$('#vid');
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let secs=[],cur=0,act=0,pi=-1,vel=null,cal=null,S={tool:'pen',color:'#35e0c2',w:4,mode:'two',th:null},V={s:1,x:0,y:0},dirty=1,rec=null,live=null,drawing=null,g0=null,TH={},cam={on:0},k=1;
const ptr=new Map(),mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const toast=t=>{const e=$('#ts');e.textContent=t;e.style.opacity=1;clearTimeout(e.t);e.t=setTimeout(()=>e.style.opacity=0,2200)};
// ---- toolbar
const T=[['pen','✎','قلم'],['hl','▮','هایلایت'],['eraser','⌫','پاک‌کن'],['line','╱','خط'],['rect','▭','مربع'],['circ','◯','دایره'],['tri','△','مثلث'],['hand','✋','حرکت (قلم غیرفعال)'],['point','👆','فقط نشان‌دادن لمس (بدون خط، بدون جابه‌جایی)']];
bar.innerHTML='<div id="tabs"></div>'+T.map(([a,i,t])=>`<button class="t" data-k="${a}" title="${t}">${i}</button>`).join('')+'<input type="color" id="col" value="#35e0c2">'+
['#35e0c2','#ff5c7a','#ffd166','#6c8bff','#ffffff','#172033'].map(c=>`<button class="sw" style="background:${c}" data-c="${c}"></button>`).join('')+
'<input type="range" id="wd" min="1" max="30" value="4"><button class="t" data-a="undo">↶</button><button class="t" data-a="redo">↷</button><button class="t" data-a="theme">◐</button><button class="t" data-a="sheet">▤</button>'+'<div class="ts"><span>👆 لمس</span><input type="color" id="tcl" value="#35e0c2" title="رنگ نشانگر لمس"><input type="range" id="tsz" min="8" max="60" value="20" style="width:100%;accent-color:var(--ac)" title="اندازه‌ی نشانگر لمس"></div>';
const icon={board:'⬜',book:'📕',img:'🖼',vid:'🎞'};
const nm={board:'تخته',book:'کتاب',img:'عکس',vid:'ویدیو'};
function ui(){const q=$('#qt');if(q){const h=S.tool=='hand';q.textContent=h?'✋':'✎';q.style.background=h?'var(--ac)':'var(--pn)';q.style.color=h?'#06201b':'inherit'}bar.querySelectorAll('[data-k]').forEach(b=>b.classList.toggle('on',b.dataset.k==S.tool));pi=-1;vui();const n={};
 $('#tabs').innerHTML=secs.map((s,i)=>{n[s.kind]=(n[s.kind]||0)+1;return `<button data-g="${i}" class="${i==cur?'on':''}">${icon[s.kind]} ${nm[s.kind]} ${n[s.kind]}</button>`}).join('')+'<button data-a="new" title="تخته‌ی جدید">＋</button>';
 $('#tabs .on')?.scrollIntoView({inline:'center',block:'nearest'})}
function theme(){const r=document.documentElement,g=getComputedStyle(r);TH.bg=g.getPropertyValue('--bg').trim();TH.pp=g.getPropertyValue('--pp').trim();$('meta[name=theme-color]').content=TH.bg;dirty=1}
const midItem=()=>itemAt(secs[cur],(innerHeight/2-V.y)/V.s);
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.k){if(d.k!='hand')S.last=d.k;S.tool=d.k;ui()}else if(d.c){S.color=d.c;$('#col').value=d.c}else if(d.g)go(+d.g);
 else if(d.a=='undo'){const s=secs[cur],it=s.hist.pop();if(it){s.rhist.push(it);it.redo.push(it.strokes.pop());redrawInk(it);scheduleSave()}}
 else if(d.a=='redo'){const s=secs[cur],it=s.rhist.pop();if(it){s.hist.push(it);it.strokes.push(it.redo.pop());redrawInk(it);scheduleSave()}}
 else if(d.a=='theme'){document.documentElement.classList.toggle('day');theme()}
 else if(d.a=='vplay')vtog();else if(d.a=='music')musicDlg();else if(d.a=='clr')clearInk();else if(d.a=='sheet')sh.classList.toggle('h');else if(d.a=='fit')fit();else if(d.a=='cal')calib();
 else if(d.a=='new')addSec(mkSec('تخته',[{h:2400}],'board'));
 else if(d.a=='copy'){const it=midItem();if(it.pdf&&!it.bg){toast('صفحه هنوز آماده نیست');return}if(!it.ink&&it.strokes.length)redrawInk(it);
  const c=mk(W,it.h),x=c.getContext('2d');x.fillStyle=(it.bg||it.img)?'#fff':TH.pp;x.fillRect(0,0,W,it.h);it.bg&&x.drawImage(it.bg,0,0);it.video&&x.drawImage(it.video,0,0,W,it.h);it.ink&&x.drawImage(it.ink,0,0);
  addSec(mkSec('تخته',[{h:it.h,bg:c,img:1}],'board'));toast('کپی شد؛ روی نسخه‌ی جدید بنویس')}});
$('#col').oninput=e=>S.color=e.target.value;$('#wd').oninput=e=>S.w=+e.target.value;
$('#md').onchange=e=>{S.mode=e.target.value;saveS();if(S.mode=='auto'&&S.th==null)calib()};
$('#mn').onclick=()=>{bar.classList.toggle('h');sh.classList.add('h')};
$('#sf').value=localStorage.cm_sf??'3';$('#sf').onchange=e=>localStorage.cm_sf=e.target.value;
$('#qt').onclick=()=>{if(S.tool=='hand')S.tool=S.last||'pen';else{S.last=S.tool;S.tool='hand'}ui()};
$('#qu').onclick=()=>bar.querySelector('[data-a=undo]').click();
$('#sl').oninput=e=>{const it=secs[cur].items[e.target.value-1];if(it){V.y=-it.y*V.s;cl()}};
function saveS(){try{localStorage.cm=JSON.stringify({md:S.mode,th:S.th})}catch{}}
try{const o=JSON.parse(localStorage.cm||'{}');if(o.md){S.mode=o.md;$('#md').value=o.md}S.th=o.th??null}catch{}
// ---- sections: board / book (all pages stacked) / image
function mkSec(name,items,kind){const s={name,kind,items,hist:[],rhist:[],V:null};items.forEach(it=>{it.strokes=[];it.redo=[];it.sec=s});relayout(s);return s}
function relayout(s){const a=s===secs[cur]&&s.items.length>1?itemAt(s,-V.y/V.s):null,off=a?-V.y/V.s-a.y:0;let y=0;s.items.forEach(it=>{it.y=y;y+=it.h+GAP});s.H=y-GAP;if(a)V.y=-(a.y+off)*V.s;if(s===secs[cur])cl()}
function itemAt(s,y){let a=s.items[0];for(const it of s.items){if(it.y<=y)a=it;else break}return a}
function addSec(s){secs.push(s);go(secs.length-1)}
function go(i){cur=Math.max(0,Math.min(secs.length-1,i));live=drawing=null;const s=secs[cur];if(!s.V)s.V={s:innerWidth/W,x:0,y:0};V=s.V;secs.forEach(x=>x!==s&&x.kind=='vid'&&x.items[0].video.pause());cl();ui();scheduleSave()}
async function render(it){it.busy=1;act++;try{const pg=await it.pdf.getPage(it.no),sc=W/pg.getViewport({scale:1}).width,v=pg.getViewport({scale:sc}),c=mk(W,Math.round(v.height));
 await pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise;it.bg=c;if(Math.abs(it.h-c.height)>1){it.h=c.height;it.ink=null;relayout(it.sec)}}catch{}it.busy=0;act--;dirty=1}
const need=it=>{if(it.pdf&&!it.bg&&!it.busy&&act<2)render(it);if(!it.ink&&it.strokes.length)redrawInk(it)};
async function sizeAll(s,doc){let p=0;for(let n=2;n<=doc.numPages;n++){const v=(await doc.getPage(n)).getViewport({scale:1}),h=Math.round(v.height*W/v.width),it=s.items[n-1];
 if(Math.abs(it.h-h)>1){it.h=h;it.ink=null;it.bg=null;p=1}if(n%25==0||n==doc.numPages){if(p){relayout(s);p=0}await new Promise(r=>setTimeout(r))}}}
$('#fp').onchange=async e=>{const f=e.target.files[0];if(!f)return;
 if(/\.(pptx?|ppsx?|odp)$/i.test(f.name)){e.target.value='';await ask('مرورگر نمی‌تواند فایل پاورپوینت را مستقیم نمایش دهد. یک بار آن را به <b>PDF</b> تبدیل کن، بعد همین دکمه را بزن و PDF را انتخاب کن؛ هر اسلاید یک صفحه می‌شود.<br><small>پاورپوینت: File ← Export (یا Save as) ← PDF<br>گوشی: ⋯ ← Share/Export ← PDF<br>گوگل اسلایدز: File ← Download ← PDF</small>',['باشه']);return}
toast('در حال باز کردن کتاب…');
 try{const buf=await f.arrayBuffer(),keep=buf.slice(0),doc=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise,v=(await doc.getPage(1)).getViewport({scale:1}),h=Math.round(v.height*W/v.width);
  const s=mkSec('کتاب',Array.from({length:doc.numPages},(_,i)=>({pdf:doc,no:i+1,h})),'book');s.pdfId=Math.random().toString(36).slice(2);cput('pdf',{id:s.pdfId,data:keep});addSec(s);toast(doc.numPages+' صفحه؛ با کشیدن انگشت ورق بزن');sizeAll(s,doc)}catch{toast('فایل PDF باز نشد')}e.target.value=''};
$('#fi').onchange=async e=>{const f=e.target.files[0];if(!f)return;const b=await createImageBitmap(f),h=Math.round(W*b.height/b.width),c=mk(W,h);c.getContext('2d').drawImage(b,0,0,W,h);addSec(mkSec('عکس',[{h,bg:c,img:1}],'img'));e.target.value=''};
setInterval(()=>{const s=secs[cur];if(!s||s.items.length<2)return;const m=innerHeight*3/V.s,c=(innerHeight/2-V.y)/V.s;for(const it of s.items)if(Math.abs(it.y+it.h/2-c)>m){if(it.pdf)it.bg=null;it.ink=null}},2500);
// ---- video sections (load a clip, play it on the canvas, record voice-over)
const cvid=()=>{const s=secs[cur];return s&&s.kind=='vid'?s.items[0].video:null};
const mmss=t=>{t=Math.max(0,Math.floor(t||0));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
function vsync(){const v=cvid();if(!v)return;$('#vs').max=v.duration||1;$('#vs').value=v.currentTime;$('#vt').textContent=mmss(v.currentTime)+' / '+mmss(v.duration);const t=v.paused?'▶':'⏸';const b=document.querySelector('#vr [data-a=vplay]');if(b)b.textContent=t}
function vui(){const v=cvid();$('#vr').style.display=v?'flex':'none';$('#vo').style.display=v?'flex':'none';$('#vp').style.display=v?'block':'none';if(v)vsync()}
function vtog(){const v=cvid();if(!v)return;if(v.paused){if(v.ended||v.currentTime>=v.duration-.05)v.currentTime=0;v.play().catch(()=>toast('پخش ویدیو ممکن نشد'))}else v.pause()}
$('#vs').oninput=e=>{const v=cvid();if(v){v.currentTime=+e.target.value;dirty=1}};
function mkVid(blob){return new Promise((res,rej)=>{const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=URL.createObjectURL(blob);
 v.onerror=()=>rej(new Error('vid'));
 v.onloadedmetadata=()=>{const h=Math.round(W*v.videoHeight/v.videoWidth);
  ['play','pause','seeked'].forEach(n=>v.addEventListener(n,()=>{dirty=1;vsync()}));v.addEventListener('timeupdate',vsync);
  v.addEventListener('ended',()=>{vsync();if(rec&&$('#ve').checked&&cvid()===v)setTimeout(()=>rec&&rec.stop(),400)});
  v.currentTime=.01;res({h,video:v})}})}
$('#fv').onchange=async e=>{const f=e.target.files[0];if(!f)return;toast('در حال باز کردن ویدیو…');
 try{const o=await mkVid(f),s=mkSec('ویدیو',[o],'vid');s.pdfId=Math.random().toString(36).slice(2);cput('pdf',{id:s.pdfId,data:f});addSec(s);toast('ویدیو آماده است؛ ضبط را بزن و روی ویدیو صحبت کن')}catch{toast('این ویدیو در مرورگر باز نشد')}e.target.value=''};
// ---- view
function resize(){k=Math.max(1,Math.min(devicePixelRatio||1,1600/Math.max(innerWidth,innerHeight)));cv.width=innerWidth*k;cv.height=innerHeight*k;cl()}
function cl(){const s=secs[cur],f=innerWidth/W;V.s=Math.min(f*4,Math.max(f*.5,V.s));const w=W*V.s,h=(s?.H||0)*V.s;
 V.x=w<=innerWidth?(innerWidth-w)/2:Math.min(0,Math.max(innerWidth-w,V.x));V.y=h<=innerHeight?(s?.kind=='vid'?(innerHeight-h)/2:0):Math.min(0,Math.max(innerHeight-h,V.y));dirty=1}
function fit(){V.s=innerWidth/W;V.x=V.y=0;cl()}
function zoom(f,x,y){const q=innerWidth/W,n=Math.min(q*4,Math.max(q*.5,V.s*f));f=n/V.s;V.x=x-(x-V.x)*f;V.y=y-(y-V.y)*f;V.s=n;cl()}
addEventListener('resize',resize);
cv.onwheel=e=>{e.preventDefault();if(e.ctrlKey||e.metaKey)zoom(Math.exp(-e.deltaY*.01),e.clientX,e.clientY);else{V.x-=e.deltaX;V.y-=e.deltaY;cl()}};
// ---- drawing
const lw=s=>s.tool=='eraser'?s.w*4:s.tool=='hl'?s.w*3:s.w;
function sty(c,s){c.lineCap=c.lineJoin='round';c.lineWidth=lw(s);c.strokeStyle=s.color;if(s.tool=='eraser')c.globalCompositeOperation='destination-out';if(s.tool=='hl')c.globalAlpha=.35}
function paint(c,s){c.save();sty(c,s);const p=s.pts,a=p[0],b=p[p.length-1];c.beginPath();
 if(s.tool=='line'){c.moveTo(a.x,a.y);c.lineTo(b.x,b.y)}else if(s.tool=='rect')c.rect(a.x,a.y,b.x-a.x,b.y-a.y);

function ask(html,buttons){return new Promise(res=>{const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:#000b;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px';
 o.innerHTML=`<div class="pn" style="position:static;padding:16px;max-width:340px;text-align:center;line-height:1.9"><p style="margin:0 0 10px">${html}</p><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">${buttons.map((b,i)=>`<button class="${i==0?'on':''}" data-i="${i}">${b}</button>`).join('')}</div></div>`;
 o.onclick=e=>{const b=e.target.closest('button');if(b){o.remove();res(+b.dataset.i)}};document.body.appendChild(o)})}
const dlBlob=(b,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href)},8000)};

 for(const sid of Object.keys(g)){const ch=g[sid].sort((a,b)=>a.id<b.id?-1:1),mb=ch.reduce((s,x)=>s+x.blob.size,0)/1048576,mt=(ch[0].mt||'video/webm').split(';')[0],ext=mt.includes('mp4')?'mp4':'webm';
  const c=await ask(`ضبطی از دفعه‌ی قبل ناتمام مانده است (حدود ${mb.toFixed(1)} مگابایت). ذخیره‌اش کنم؟`,['💾 ذخیره‌ی ویدیو','🗑 حذف']);
  if(c==0)dlBlob(new Blob(ch.map(x=>x.blob),{type:mt}),'clip-recovered-'+sid+'.'+ext);ch.forEach(x=>cdel('rec',x.id))}}
